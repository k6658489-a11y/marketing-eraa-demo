name: Generate Marketing Eraa demos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/prospects.csv'
      - 'tools/build.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate static demo pages
        run: python tools/build.py
      - name: Commit generated demos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate approved prospect demo pages"
            git push
          fi
